[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartllm-studio"
version = "0.0.7-beta"
description = "SmartLLM Studio — Local Offline Multimodal Website, Design & Copywriting Atelier (EN + RU)"
readme = "README.md"
requires-python = ">=3.11"
license = "FSL-1.1-ALv2"
authors = [
    { name = "VKV Studio", email = "hello@vkvstudio.com" }
]
keywords = ["smartllm", "offline-ai", "web-design", "astro", "gsap", "z-image", "llama-cpp"]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
tray = ["PyQt6>=6.5"]

[project.scripts]
smartllm-studio = "smartllm_studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartllm_studio*"]

[tool.setuptools.package-data]
smartllm_studio = ["static/**/*", "data/**/*", "kb/**/*", "templates/**/*", "schema/*.json"]
