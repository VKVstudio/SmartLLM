    <text x="24" y="173" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">0 external network calls</text>
  </g>

  <!-- Footer bar -->
  <text x="28" y="308" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
