    <rect x="16" y="156" width="204" height="26" rx="4" fill="#1e293b"/>
    <text x="24" y="173" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">layers.1.ple: 102.47 GB n-gram</text>
