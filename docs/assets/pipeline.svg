    <text x="24" y="173" fill="#fcd34d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Avoids TQ2_0 CSP token loops</text>
  </g>

  <line x1="834" y1="174" x2="864" y2="174" stroke="#64748b" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Stage 4: Verification Suite -->
  <g transform="translate(868, 76)">
